<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <text x="80" y="115" fill="#8b93b8" font-size="30" letter-spacing="6">2026 SELLER GUIDE</text>
  <text x="80" y="200" fill="#ffffff" font-size="70" font-weight="800">Agentic Commerce</text>
  <text x="80" y="262" fill="#aeb6dd" font-size="36">How digital product sellers get bought</text>
  <text x="80" y="308" fill="#aeb6dd" font-size="36">by AI shopping agents.</text>

  <!-- agent node -->
  <rect x="80" y="380" width="250" height="140" rx="16" fill="#1b2344" stroke="#39406b" stroke-width="2"/>
  <circle cx="140" cy="435" r="22" fill="none" stroke="url(#acc2)" stroke-width="4"/>
  <circle cx="132" cy="430" r="3.5" fill="#22d3ee"/>
  <circle cx="148" cy="430" r="3.5" fill="#22d3ee"/>
  <path d="M130 445 Q140 452 150 445" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="180" y="415" width="120" height="12" rx="6" fill="#39406b"/>
  <rect x="180" y="440" width="90" height="12" rx="6" fill="#2c3563"/>
  <text x="105" y="500" fill="#6b76a8" font-size="18">AI AGENT</text>

  <!-- protocol chips -->
  <rect x="380" y="392" width="110" height="40" rx="20" fill="#101736" stroke="url(#acc2)" stroke-width="2"/>
  <text x="408" y="418" fill="#c7cdf2" font-size="20" font-weight="700">ACP</text>
  <rect x="380" y="444" width="110" height="40" rx="20" fill="#101736" stroke="#39406b" stroke-width="2"/>
  <text x="410" y="470" fill="#8b93b8" font-size="20" font-weight="700">UCP</text>
  <rect x="380" y="496" width="110" height="40" rx="20" fill="#101736" stroke="#39406b" stroke-width="2"/>
  <text x="410" y="522" fill="#8b93b8" font-size="20" font-weight="700">AP2</text>

  <!-- arrow to store -->
  <path d="M520 460 L640 460" stroke="url(#acc2)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M636 448 L660 460 L636 472" fill="none" stroke="url(#acc2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="530" y="440" fill="#22d3ee" font-size="19">checkout stays yours</text>

  <!-- store mock -->
  <rect x="690" y="368" width="430" height="176" rx="16" fill="#101736" stroke="#2c3563" stroke-width="2"/>
  <rect x="690" y="368" width="430" height="44" rx="16" fill="#1b2344"/>
  <circle cx="718" cy="390" r="7" fill="#6366f1"/>
  <rect x="740" y="383" width="130" height="14" rx="7" fill="#39406b"/>
  <rect x="716" y="432" width="190" height="22" rx="6" fill="url(#acc2)" opacity="0.85"/>
  <rect x="716" y="468" width="250" height="12" rx="6" fill="#39406b"/>
  <rect x="716" y="492" width="200" height="12" rx="6" fill="#2c3563"/>
  <rect x="960" y="432" width="130" height="80" rx="10" fill="#1b2344" stroke="#39406b"/>
  <text x="716" y="530" fill="#6b76a8" font-size="18">YOUR STORE, YOUR CHECKOUT</text>

  <text x="80" y="592" fill="#5f6890" font-size="24" font-weight="600">vexaris.net</text>
  <text x="860" y="592" fill="#5f6890" font-size="24">merchant of record: you</text>
</svg>
