<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="How to set up a Minecraft server store that delivers itself">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa36f"/>
      <stop offset="0.55" stop-color="#123a2c"/>
      <stop offset="1" stop-color="#08160f"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1080" cy="60" r="250" fill="#ffffff" opacity="0.06"/>
  <circle cx="90" cy="620" r="220" fill="#000000" opacity="0.25"/>

  <rect x="80" y="84" width="300" height="40" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.32"/>
  <text x="102" y="111" font-family="Consolas,Menlo,monospace" font-size="14" letter-spacing="3" fill="#ffffff" fill-opacity="0.80">GUIDE &#183; NOVEMBER 2026</text>

  <text x="76" y="244" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="#ffffff">SELL RANKS</text>
  <text x="76" y="344" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="#ffffff" fill-opacity="0.92">ON AUTOPILOT</text>

  <text x="80" y="404" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="29" fill="#ffffff" fill-opacity="0.72">Minecraft server store: payment to inventory in one command</text>

  <rect x="660" y="446" width="460" height="96" rx="18" fill="#000000" fill-opacity="0.35"/>
  <text x="688" y="488" font-family="Consolas,Menlo,monospace" font-size="22" fill="#a7e4c1">RCON DELIVERS IT</text>
  <text x="688" y="526" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#ffffff">NO PLUGIN, NO WAITING</text>

  <text x="80" y="566" font-family="Consolas,Menlo,monospace" font-size="18" letter-spacing="2" fill="#ffffff" fill-opacity="0.65">RCON IN MINUTES | FREE PLAN INCLUDED</text>
</svg>
