      <text x="24" y="48" font-family="Consolas,Menlo,monospace" font-size="14" letter-spacing="2" fill="#ffffff" fill-opacity="0.78">PLANS</text>
      <rect x="24" y="76" width="116" height="16" rx="8" fill="#ffffff" fill-opacity="0.72"/>
      <rect x="24" y="112" width="150" height="16" rx="8" fill="#ffffff" fill-opacity="0.55"/>
      <rect x="24" y="148" width="92" height="16" rx="8" fill="#ffffff" fill-opacity="0.40"/>
      <rect x="24" y="196" width="162" height="52" rx="10" fill="#ffffff" fill-opacity="0.14"/>
      <text x="105" y="229" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="15" letter-spacing="1.5" fill="#ffffff" fill-opacity="0.85">TRIAL 14D</text>
