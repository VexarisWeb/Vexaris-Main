  <circle cx="1050" cy="70" r="235" fill="#ffffff" opacity="0.07"/>
  <circle cx="120" cy="600" r="210" fill="#000000" opacity="0.20"/>

  <rect x="80" y="84" width="168" height="40" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.30"/>
  <text x="102" y="111" font-family="Consolas,Menlo,monospace" font-size="14" letter-spacing="3" fill="#ffffff" fill-opacity="0.80">PRICING</text>

  <text x="76" y="300" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="112" font-weight="800" letter-spacing="-4" fill="#ffffff">SELLFY</text>
  <text x="80" y="366" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="25" fill="#ffffff" fill-opacity="0.74">Plans, fees and the free plan truth.</text>
  <text x="80" y="404" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="25" fill="#ffffff" fill-opacity="0.74">No free tier — $22 to $159 a month.</text>

  <g transform="translate(664 110)">
    <g transform="rotate(-8 150 120)">
      <path d="M22 42 H214 A16 16 0 0 1 230 58 V214 A16 16 0 0 1 214 230 H22 A16 16 0 0 1 6 214 V58 A16 16 0 0 1 22 42 Z" fill="#ffffff" fill-opacity="0.92"/>
      <circle cx="58" cy="82" r="13" fill="#053a31" fill-opacity="0.28"/>
      <circle cx="58" cy="82" r="5" fill="#0b6f5c"/>
      <text x="124" y="140" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#0b4a3e">$22–159</text>
      <text x="124" y="172" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="2" fill="#0b4a3e" fill-opacity="0.66">PER MONTH</text>
      <rect x="44" y="196" width="152" height="14" rx="7" fill="#0b4a3e" fill-opacity="0.18"/>
    </g>

