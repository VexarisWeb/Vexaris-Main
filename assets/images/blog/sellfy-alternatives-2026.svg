    <g transform="translate(198 236)">
      <circle cx="52" cy="52" r="52" fill="#ffd79a" fill-opacity="0.16" stroke="#ffd79a" stroke-opacity="0.85" stroke-width="4"/>
      <text x="52" y="66" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="800" fill="#ffd79a">2%</text>
