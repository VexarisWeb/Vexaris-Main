server {
    server_name demo.vexaris.net www.demo.vexaris.net ;

    listen 10.50.1.14:80;
    listen 10.50.1.14:443 ssl;

    ssl_certificate "/etc/letsencrypt/live/demo.vexaris.net/fullchain.pem";
    ssl_certificate_key "/etc/letsencrypt/live/demo.vexaris.net/privkey.pem";
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/css image/x-ico application/pdf image/jpeg image/png image/gif application/javascript application/x-javascript application/x-pointplus;
    gzip_comp_level 1;

    set $root_path /var/www/demo_vexaris_usr20/data/www/demo.vexaris.net;
    root $root_path;
    disable_symlinks if_not_owner from=$root_path;

    # Origin kalkani: yalnizca CF kenari + yerel ag (ACME istisna)
    if ($vx_peer_deny) { return 444; }

    location / {
        index index.php index.html;
        try_files $uri $uri/ @extensionless;
    }

    location @extensionless {
        if ($uri ~ \.) { return 404; }
        if (!-f $document_root$uri.php) { return 404; }
        rewrite ^ $uri.php last;
    }

    location ~ \.php$ {
        include /etc/nginx/fastcgi_params;fastcgi_pass unix:/var/run/demo.vexaris.net.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
     }


    location ~* ^.+\.(jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpeg|avi|zip|gz|bz2|rar|swf|ico|7z|doc|docx|map|ogg|otf|pdf|ttf|tif|txt|wav|webp|woff|woff2|xls|xlsx|xml)$ {
        try_files $uri $uri/ /index.php?$args;
    }

    location @fallback {fastcgi_pass unix:/var/run/demo.vexaris.net.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include /etc/nginx/fastcgi_params;
    }

    include "/etc/nginx/fastpanel2-sites/demo_vexaris_usr20/demo.vexaris.net.includes";
    include /etc/nginx/fastpanel2-includes/*.conf;

    error_log /var/www/demo_vexaris_usr20/data/logs/demo.vexaris.net-frontend.error.log;
    access_log /var/www/demo_vexaris_usr20/data/logs/demo.vexaris.net-frontend.access.log;
}
