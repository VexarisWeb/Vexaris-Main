
server {
    server_name vexaris.net www.vexaris.net ;

    listen 10.50.1.14:80;
    listen 10.50.1.14:443 ssl;
    
        

    ssl_certificate "/var/www/httpd-cert/vexaris.net_2026-10-09-16-52_49.crt";
    ssl_certificate_key "/var/www/httpd-cert/vexaris.net_2026-10-09-16-52_49.key";

    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/css image/x-ico application/pdf image/jpeg image/png image/gif application/javascript application/x-javascript application/x-pointplus;
    gzip_comp_level 1;
    
    set $root_path /var/www/vexaris_net_usr/data/www/vexaris.net;
    root $root_path;
    disable_symlinks if_not_owner from=$root_path;

    # Guvenlik / performans
    client_max_body_size 100m;      # FPM post_max_size ile ayni (zip yukleme)
    fastcgi_hide_header X-Powered-By;

    location / {
        index index.php index.html;
        # Bot korumasi: gercek kullanici IP'si (CF-Connecting-IP) uzerinden
        limit_req zone=vxphp burst=20 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include /etc/nginx/fastcgi_params;fastcgi_pass unix:/var/run/vexaris.net.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
     }


    location ~* ^.+\.(jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpeg|avi|zip|gz|bz2|rar|swf|ico|7z|doc|docx|map|ogg|otf|pdf|ttf|tif|txt|wav|webp|woff|woff2|xls|xlsx|xml)$ {
        try_files $uri $uri/ /index.php?$args;
    }

    # Statik varliklar (cache-busting ?v= ile degisir) -> uzun sure cache
    location ^~ /assets/ {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location @fallback {fastcgi_pass unix:/var/run/vexaris.net.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include /etc/nginx/fastcgi_params;
    }

    include "/etc/nginx/fastpanel2-sites/vexaris_net_usr/vexaris.net.includes";
    include /etc/nginx/fastpanel2-includes/*.conf;

    error_log /var/www/vexaris_net_usr/data/logs/vexaris.net-frontend.error.log;
    access_log /var/www/vexaris_net_usr/data/logs/vexaris.net-frontend.access.log;
}