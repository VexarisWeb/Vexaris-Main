# Origin kalkanı: 443/80 ustunde yalnizca Cloudflare kenari + yerel/ozel ag kabul edilir.
# $realip_remote_addr = real_ip modulunden ONCEKI gercek TCP esi (CF disi dogrudan baglanti).
geo $realip_remote_addr $vx_peer_ok {
    default 0;

    127.0.0.1/32 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    ::1/128 1;
    fe80::/10 1;

    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;

    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# ACME HTTP-01 dogrulamasi CF disindan da gelebilmelidir; diger her sey 444.
map "$vx_peer_ok:$request_uri" $vx_peer_deny {
    default 1;
    "~^1:" 0;
    "~^0:/\\.well-known/acme-challenge/" 0;
}
